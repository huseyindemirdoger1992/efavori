name: 🚀 Plesk MVC FTP Deploy (Zero-Lock Strategy)

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x' 

    - name: 🔨 Publish Project (x86)
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ./publish

    # --- ADIM 1: SADECE APP_OFFLINE.HTM GÖNDER (KİLİDİ AÇMAK İÇİN) ---
    - name: 🛑 Stop App (Upload app_offline only)
      shell: pwsh
      run: |
        mkdir ./offline_stage
        "<html><body><h1>Bakim Calismasi</h1></body></html>" | Out-File -FilePath ./offline_stage/app_offline.htm -Encoding utf8

    - name: 📤 Upload app_offline.htm
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./offline_stage/
        server-dir: httpdocs/

    # --- ADIM 2: BEKLEME SÜRESİ (OPSİYONEL AMA GARANTİ) ---
    - name: ⏳ Wait for IIS to release locks
      run: Start-Sleep -s 5
      shell: pwsh

    # --- ADIM 3: ASIL PROJEYİ GÖNDER ---
    - name: 📂 Sync Project Files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        state-name: .ftp-deploy-sync-state.json # Değişenleri takip eder
        protocol: ftp
        port: 21
        # app_offline.htm dosyasının silinmemesi için burada exclude etmiyoruz 
        # Böylece publish içindekiyle senkronize kalır.
        exclude: |
          **/_files/**
          _files/**
          **/.git*
          **/.github/**
          **/appsettings.Development.json
          **/web.config

    # --- ADIM 4: SİTEYİ TEKRAR AÇ (APP_OFFLINE.HTM'İ SİL) ---
    - name: 🚀 Start App (Delete app_offline)
      shell: pwsh
      run: |
        # Publish klasöründen dosyayı siliyoruz
        Remove-Item ./publish/app_offline.htm -Force
    
    - name: 🧹 Final Sync to Remove app_offline
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        # Bu adımda yerelde olmayan app_offline.htm sunucudan silinecektir.
