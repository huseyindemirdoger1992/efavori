name: Deploy to FTP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Verify .NET Installation
      run: |
        dotnet --version
        dotnet --list-sdks
    
    - name: Clean previous builds
      run: |
        if (Test-Path "./publish") { Remove-Item -Path "./publish" -Recurse -Force }
        if (Test-Path "./deployment.zip") { Remove-Item -Path "./deployment.zip" -Force }
        dotnet clean --configuration Release
    
    - name: Restore dependencies
      run: |
        dotnet restore --verbosity normal
      continue-on-error: false
    
    - name: Build project
      run: |
        dotnet build --configuration Release --no-restore --verbosity normal
      continue-on-error: false
    
    - name: Publish project (MVC - Framework-Dependent)
      run: |
        dotnet publish efavori.slnx --configuration Release `
          --runtime win-x86 `
          --self-contained true `
          --output ./publish `
          --verbosity normal
      continue-on-error: false
    
    - name: Verify publish output
      run: |
        if (-not (Test-Path "./publish")) {
            Write-Error "Publish folder not found!"
            exit 1
        }
        $fileCount = (Get-ChildItem -Path "./publish" -Recurse -File).Count
        $totalSize = (Get-ChildItem -Path "./publish" -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB
        Write-Host "✅ Published files count: $fileCount"
        Write-Host "✅ Total size: $([math]::Round($totalSize, 2)) MB"
        if ($fileCount -eq 0) {
            Write-Error "No files found in publish folder!"
            exit 1
        }
    
    - name: Create deployment package (backup)
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath deployment.zip -Force
        $zipSize = (Get-Item "./deployment.zip").Length / 1MB
        Write-Host "✅ Deployment package created: $([math]::Round($zipSize, 2)) MB"
    
    - name: Deploy to FTP (Incremental with Enhanced Error Handling)
      shell: pwsh
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_ACCOUNT: ${{ secrets.FTP_ACCOUNT }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        # Configuration
        $maxRetries = 5
        $retryDelay = 10
        $connectionTimeout = 300000  # 5 minutes
        $uploadedFiles = @()
        $skippedFiles = @()
        $failedFiles = @()
        
        # Validate FTP credentials
        if ([string]::IsNullOrWhiteSpace($env:FTP_SERVER)) {
            Write-Error "❌ FTP_SERVER secret is not set!"
            exit 1
        }
        if ([string]::IsNullOrWhiteSpace($env:FTP_ACCOUNT)) {
            Write-Error "❌ FTP_ACCOUNT secret is not set!"
            exit 1
        }
        if ([string]::IsNullOrWhiteSpace($env:FTP_PASSWORD)) {
            Write-Error "❌ FTP_PASSWORD secret is not set!"
            exit 1
        }
        
        Write-Host "🔧 FTP Server: $env:FTP_SERVER"
        Write-Host "👤 FTP Account: $env:FTP_ACCOUNT"
        Write-Host ""
        
        # Function: Test FTP Connection
        function Test-FtpConnection {
            try {
                Write-Host "🔌 Testing FTP connection..."
                $testRequest = [System.Net.FtpWebRequest]::Create("ftp://$env:FTP_SERVER/")
                $testRequest.Credentials = New-Object System.Net.NetworkCredential($env:FTP_ACCOUNT, $env:FTP_PASSWORD)
                $testRequest.Method = [System.Net.WebRequestMethods+Ftp]::ListDirectory
                $testRequest.Timeout = 30000
                $testRequest.KeepAlive = $false
                
                $response = $testRequest.GetResponse()
                $response.Close()
                Write-Host "✅ FTP connection successful!"
                return $true
            }
            catch {
                Write-Error "❌ FTP connection failed: $_"
                return $false
            }
        }
        
        # Function: Get remote file size
        function Get-FtpFileSize {
            param($RemotePath)
            try {
                $ftpRequest = [System.Net.FtpWebRequest]::Create("ftp://$env:FTP_SERVER/$RemotePath")
                $ftpRequest.Credentials = New-Object System.Net.NetworkCredential($env:FTP_ACCOUNT, $env:FTP_PASSWORD)
                $ftpRequest.Method = [System.Net.WebRequestMethods+Ftp]::GetFileSize
                $ftpRequest.Timeout = 15000
                $ftpRequest.KeepAlive = $false
                
                $response = $ftpRequest.GetResponse()
                $size = $response.ContentLength
                $response.Close()
                return $size
            }
            catch {
                return -1  # File doesn't exist or error
            }
        }
        
        # Function: Upload file with retry logic
        function Upload-FileWithRetry {
            param(
                [string]$LocalPath,
                [string]$RemotePath
            )
            
            $localFileInfo = Get-Item $LocalPath
            $localSize = $localFileInfo.Length
            
            for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
                try {
                    Write-Host "  📤 Attempt $attempt/$maxRetries - Uploading: $($localFileInfo.Name) ($([math]::Round($localSize/1KB, 2)) KB)"
                    
                    $ftpRequest = [System.Net.FtpWebRequest]::Create("ftp://$env:FTP_SERVER/$RemotePath")
                    $ftpRequest.Credentials = New-Object System.Net.NetworkCredential($env:FTP_ACCOUNT, $env:FTP_PASSWORD)
                    $ftpRequest.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
                    $ftpRequest.UseBinary = $true
                    $ftpRequest.KeepAlive = $false
                    $ftpRequest.UsePassive = $true
                    $ftpRequest.Timeout = $connectionTimeout
                    $ftpRequest.ReadWriteTimeout = $connectionTimeout
                    
                    # Read file content
                    $fileContent = [System.IO.File]::ReadAllBytes($LocalPath)
                    $ftpRequest.ContentLength = $fileContent.Length
                    
                    # Upload with progress
                    $requestStream = $ftpRequest.GetRequestStream()
                    $requestStream.Write($fileContent, 0, $fileContent.Length)
                    $requestStream.Close()
                    $requestStream.Dispose()
                    
                    # Get response
                    $response = $ftpRequest.GetResponse()
                    $statusDescription = $response.StatusDescription
                    $response.Close()
                    
                    # Verify upload
                    Start-Sleep -Milliseconds 500
                    $remoteSize = Get-FtpFileSize -RemotePath $RemotePath
                    
                    if ($remoteSize -eq $localSize) {
                        Write-Host "  ✅ Upload successful - Verified ($remoteSize bytes)"
                        return $true
                    }
                    elseif ($remoteSize -gt 0) {
                        Write-Warning "  ⚠️ Size mismatch! Local: $localSize, Remote: $remoteSize - Retrying..."
                    }
                    else {
                        Write-Warning "  ⚠️ Could not verify upload - Assuming success"
                        return $true
                    }
                }
                catch {
                    $errorMessage = $_.Exception.Message
                    Write-Warning "  ⚠️ Attempt $attempt failed: $errorMessage"
                    
                    if ($attempt -lt $maxRetries) {
                        Write-Host "  ⏳ Waiting $retryDelay seconds before retry..."
                        Start-Sleep -Seconds $retryDelay
                    }
                }
            }
            
            Write-Error "  ❌ Failed to upload after $maxRetries attempts: $RemotePath"
            return $false
        }
        
        # Function: Create FTP directory recursively
        function Create-FtpDirectory {
            param([string]$RemotePath)
            
            if ([string]::IsNullOrWhiteSpace($RemotePath) -or $RemotePath -eq "httpdocs") {
                return
            }
            
            try {
                $ftpRequest = [System.Net.FtpWebRequest]::Create("ftp://$env:FTP_SERVER/$RemotePath")
                $ftpRequest.Credentials = New-Object System.Net.NetworkCredential($env:FTP_ACCOUNT, $env:FTP_PASSWORD)
                $ftpRequest.Method = [System.Net.WebRequestMethods+Ftp]::MakeDirectory
                $ftpRequest.Timeout = 30000
                $ftpRequest.KeepAlive = $false
                
                $response = $ftpRequest.GetResponse()
                $response.Close()
                Write-Host "📁 Created directory: $RemotePath"
            }
            catch {
                # Directory might already exist - this is fine
            }
        }
        
        # Function: Check if path should be excluded
        function Test-ExcludedPath {
            param([string]$Path)
            
            $excludedPatterns = @(
                "*/_files/*",
                "_files\*",
                "_files/*",
                "*/obj/*",
                "*/bin/*",
                "*.pdb",
                "*.xml",
                "web.config"
            )
            
            foreach ($pattern in $excludedPatterns) {
                if ($Path -like $pattern) {
                    return $true
                }
            }
            return $false
        }
        
        # Test FTP connection first
        if (-not (Test-FtpConnection)) {
            Write-Error "❌ Cannot proceed - FTP connection test failed!"
            exit 1
        }
        
        Write-Host ""
        Write-Host "========================================="
        Write-Host "🚀 Starting Incremental Deployment"
        Write-Host "========================================="
        Write-Host ""
        
        # Get all files from publish folder
        $publishFolder = "./publish"
        $remoteBase = "httpdocs"
        
        if (-not (Test-Path $publishFolder)) {
            Write-Error "❌ Publish folder not found: $publishFolder"
            exit 1
        }
        
        $allFiles = Get-ChildItem -Path $publishFolder -Recurse -File | Where-Object {
            -not (Test-ExcludedPath -Path $_.FullName)
        }
        
        $totalFiles = $allFiles.Count
        $currentFile = 0
        
        Write-Host "📊 Total files to process: $totalFiles"
        Write-Host ""
        
        foreach ($file in $allFiles) {
            $currentFile++
            $relativePath = $file.FullName.Substring($publishFolder.Length + 1)
            $remotePath = "$remoteBase/$($relativePath -replace '\\', '/')"
            
            Write-Host "[$currentFile/$totalFiles] Processing: $relativePath"
            
            # Check if file is excluded
            if (Test-ExcludedPath -Path $relativePath) {
                Write-Host "  🚫 Excluded by pattern"
                $skippedFiles += $relativePath
                continue
            }
            
            # Get file sizes
            $localSize = $file.Length
            $remoteSize = Get-FtpFileSize -RemotePath $remotePath
            
            # Determine if upload is needed
            $needsUpload = $false
            if ($remoteSize -eq -1) {
                Write-Host "  📄 New file detected"
                $needsUpload = $true
            }
            elseif ($remoteSize -ne $localSize) {
                Write-Host "  🔄 File changed (Local: $localSize bytes, Remote: $remoteSize bytes)"
                $needsUpload = $true
            }
            else {
                Write-Host "  ⏭️ Unchanged - skipping"
                $skippedFiles += $relativePath
                continue
            }
            
            # Create remote directory if needed
            $remoteDir = Split-Path $remotePath -Parent
            if ($remoteDir) {
                Create-FtpDirectory -RemotePath $remoteDir
            }
            
            # Upload file
            if (Upload-FileWithRetry -LocalPath $file.FullName -RemotePath $remotePath) {
                $uploadedFiles += $relativePath
            }
            else {
                $failedFiles += $relativePath
            }
            
            # Small delay to prevent overwhelming the server
            Start-Sleep -Milliseconds 200
            Write-Host ""
        }
        
        # Summary
        Write-Host ""
        Write-Host "========================================="
        Write-Host "📊 Deployment Summary"
        Write-Host "========================================="
        Write-Host "✅ Uploaded:  $($uploadedFiles.Count) files"
        Write-Host "⏭️ Skipped:   $($skippedFiles.Count) files"
        Write-Host "❌ Failed:    $($failedFiles.Count) files"
        Write-Host "📦 Total:     $totalFiles files"
        Write-Host "========================================="
        
        if ($failedFiles.Count -gt 0) {
            Write-Host ""
            Write-Host "❌ Failed files:"
            $failedFiles | ForEach-Object { Write-Host "  - $_" }
            Write-Host ""
            Write-Error "Deployment completed with errors!"
            exit 1
        }
        
        Write-Host ""
        Write-Host "🎉 Deployment completed successfully!"
    
    - name: Upload deployment package as artifact (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: deployment.zip
        retention-days: 7
