name: 🚀 Smart MVC Deploy (Sync Only Changes)

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: 🎉 Deploy to Plesk
    runs-on: windows-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 🔨 Publish Project
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ./publish

    # 1. ADIM: Sadece app_offline.htm dosyasını gönder ve durdur
    - name: 🛑 Stop App (Upload app_offline)
      shell: pwsh
      run: |
        "<html><head><meta charset='utf-8'></head><body><h1>Sistem Guncelleniyor...</h1></body></html>" | Out-File -FilePath "./publish/app_offline.htm" -Encoding utf8

    - name: 📤 Upload app_offline Only
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        port: 21
        only: |
          app_offline.htm

    # 2. ADIM: IIS'in dosyaları serbest bırakması için bekle
    - name: ⏳ Wait for IIS to Release Files
      run: Start-Sleep -s 15
      shell: pwsh

    # 3. ADIM: Asıl dosyaları gönder (Kilitlenme riski artık minimum)
    - name: 📤 FTP Sync (Smart)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        port: 21
        dangerous-clean-slate: false
        exclude: |
          **/_files/**
          _files/**
          **/appsettings.Development.json
          **/.git*
          **/.github/**
        
    # 4. ADIM: Sistemi tekrar aç
    - name: 🚀 Go Online
      shell: pwsh
      run: |
        if (Test-Path "./publish/app_offline.htm") {
            Remove-Item "./publish/app_offline.htm" -Force
        }

    - name: 🧹 Final Clean
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        exclude: |
          **/_files/**
          _files/**
