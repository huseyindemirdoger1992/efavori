name: 🚀 Plesk MVC FTP Deploy (Zero-Lock Strategy)

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x' 

    - name: 🔨 Publish Project (x86)
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ./publish

    # --- 1. ADIM: UYGULAMAYI DURDUR (KİLİDİ AÇ) ---
    - name: 🛑 Create App Offline File
      shell: pwsh
      run: |
        "<!DOCTYPE html><html><head><meta charset='utf-8'></head><body><div style='text-align:center;margin-top:100px;'><h1>Sistem Guncelleniyor</h1><p>Lutfen bekleyiniz, site birkac dakika icinde aktif olacaktir.</p></div></body></html>" | Out-File -FilePath ./publish/app_offline.htm -Encoding utf8

    # --- 2. ADIM: ANA DOSYALARI VE KİLİT DOSYASINI GÖNDER ---
    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        state-name: .ftp-deploy-sync-state.json
        
        # SALDIRI KORUMASI: 
        # Paralel bağlantıyı kapatıyoruz (Aynı anda sadece 1 dosya)
        # Bu işlem biraz daha yavaş sürer ama banlanma riskini sıfırlar.
        protocol: ftp
        port: 21
        timeout: 90000 
        
        exclude: |
          **/_files/**
          _files/**
          **/.git*
          **/.github/**
          **/appsettings.Development.json

    # --- 3. ADIM: UYGULAMAYI TEKRAR AÇ ---
    # app_offline.htm dosyasını sunucudan silerek IIS'i tetikliyoruz.
    - name: 🚀 Remove App Offline (Make Site Live)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: httpdocs/
        # Sadece bu dosyayı silmek için boş bir yerel dizin veya 'delete' komutu kullanılır.
        # En temiz yol, sunucudaki dosyayı 'exclude' etmeden ama yerelde silerek senkronize etmektir.
        # Alternatif: Script ile doğrudan sunucudan silebilirsin.
        method: sftp-or-ftp # Bağlantı türüne göre
