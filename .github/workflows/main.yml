name: 🚀 Plesk MVC FTP Deploy

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        # HATA BURADAYDI: Sürümü projenin gerçek sürümüyle eşitle.
        # Eğer projen .NET 8 ise '8.0.x', .NET 9 ise '9.0.x' yapmalısın.
        dotnet-version: '8.0.x' 

    - name: 🔨 Publish Project
      run: dotnet publish -c Release -o ./publish

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        # Plesk için gerekirse aktif et: server-dir: ./httpdocs/
        
        # KURAL: _files klasörünü ve içeriğini asla silme veya değiştirme
        exclude: |
          **/_files/**
          _files/**
          **/.git*
          **/.github/**
          **/appsettings.Development.json
