name: 🚀 Pro-Level Plesk MVC FTP Deploy
on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest
    # Timeout ekleyerek asılı kalan process'lerin dakikalarca fatura kesmesini önlüyoruz.
    timeout-minutes: 15 

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 🔨 Publish Project
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ${{ github.workspace }}/publish

    # ========================================
    # 1. ADIM: IIS KİLİDİNİ KIR VE HAZIRLA
    # ========================================
    
    - name: 🛑 Prepare app_offline.htm
      shell: pwsh
      run: |
        $path = "${{ github.workspace }}/publish/app_offline.htm"
        $content = @"
        <!DOCTYPE html><html><head><meta charset='utf-8'><meta http-equiv='refresh' content='10'><title>Bakım</title></head>
        <body style='font-family:sans-serif;text-align:center;margin-top:100px;'><h1>🔄 Güncelleme Yapılıyor</h1><p>Hizmet kalitemizi artırmak için kısa bir ara verdik.</p></body></html>
        "@
        $content | Out-File -FilePath $path -Encoding UTF8
    
    - name: 📤 Upload app_offline.htm (Lock Site)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        exclude: |
          **/*
          !app_offline.htm

    - name: ⏳ Wait for IIS Lock Release
      shell: pwsh
      run: |
        Write-Host "Waiting 30s for IIS worker process to release DLLs..."
        Start-Sleep -s 30 # IIS'in dosyaları serbest bırakması için gereken altın süre.

    # ========================================
    # 2. ADIM: DELTA DEPLOYMENT (SADECE DEĞİŞENLER)
    # ========================================
    
    - name: 📂 Deploy Changed Files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        state-name: .ftp-deploy-sync-state.json
        protocol: ftp
        port: 21
        timeout: 600000 # 10 dakika (Büyük DLL transferleri için)
        retries: 10
        parallel: 1 # Çakışma riskini sıfıra indirmek için ardışık yükleme
        exclude: |
          **/appsettings.Development.json
          **/.git*
          **/.github/**
          _files/**
          **/_files/**
          app_offline.htm

    # ========================================
    # 3. ADIM: CLEANUP & RESTART (GÜVENLİ DÖNÜŞ)
    # ========================================

    - name: 🚀 Start IIS (Force Remove app_offline)
      # if: always() kullanarak deploy hata alsa bile siteyi tekrar açmaya çalışıyoruz.
      if: always() 
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/ # Boş bir klasör yerine state üzerinden silme
        server-dir: httpdocs/
        dangerous-clean-slate: false
        exclude: |
          **/*
          app_offline.htm # Exclude listesinden çıkarırsan silinmez, o yüzden dikkat.
          # FTP-Deploy-Action yerel dosyada olmayan ama sunucuda olanı silme mantığıyla çalışır.
          # Bu adımda yerelde app_offline.htm silindiği için sunucudan da silinecektir.

    - name: 🧹 Final Local Cleanup
      if: always()
      shell: pwsh
      run: |
        if (Test-Path "${{ github.workspace }}/publish/app_offline.htm") {
            Remove-Item "${{ github.workspace }}/publish/app_offline.htm" -Force
        }

    - name: 🌡️ Critical Warm Up & Health Check
      shell: pwsh
      run: |
        $url = "https://efavori.com"
        $maxRetries = 10
        for($i=1; $i -le $maxRetries; $i++) {
          try {
            Write-Host "Health Check Attempt $i..."
            $res = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 20
            if ($res.StatusCode -eq 200) {
              Write-Host "✅ Site is Online and Healthy!"
              exit 0
            }
          } catch {
            Write-Warning "Waiting for IIS... ($($_.Exception.Message))"
            Start-Sleep -s 10
          }
        }
        Write-Error "❌ Deployment succeeded but Site is not responding!"
        exit 1
