name: 🚀 Smart MVC Deploy (Sync Only Changes)

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: 🎉 Deploy to Plesk
    runs-on: windows-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 🔨 Publish Project
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ./publish

    - name: 🛑 Prepare Offline Mode
      shell: pwsh
      run: |
        "<html><head><meta charset='utf-8'></head><body><h1>Sistem Guncelleniyor...</h1></body></html>" | Out-File -FilePath "./publish/app_offline.htm" -Encoding utf8

    - name: 📤 FTP Sync
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        port: 21
        # KRİTİK AYARLAR:
        dangerous-clean-slate: false # Sunucudaki yabancı dosyalara (örneğin _files) ASLA dokunmaz
        exclude: |
          **/_files/** # Sunucudaki ve yereldeki _files klasörünü tamamen muaf tutar
          _files/**
          **/appsettings.Development.json
          **/.git*
          **/.github/**
        
    - name: 🚀 Go Online
      shell: pwsh
      run: |
        if (Test-Path "./publish/app_offline.htm") {
            Remove-Item "./publish/app_offline.htm" -Force
        }

    - name: 🧹 Final Clean (Remove app_offline)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        exclude: |
          **/_files/**
          _files/**
