name: 🚀 Plesk MVC FTP Deploy (Final)

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        # ÖNEMLİ: Eğer projen .NET 8 ise burayı 8.0.x yap. 
        # Hata logunda net10.0 gördüğüm için 10.0.x yazıyorum.
        dotnet-version: '10.0.x' 

    - name: 🔨 Publish Project
      # ÇÖZÜM: Hangi projeyi publish edeceğini tam olarak belirtiyoruz.
      # 'web.csproj' yerine kendi ana projenin dosya adını yazmalısın.
      run: dotnet publish web/web.csproj -c Release -o ./publish --no-self-contained

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        
        # Hız ve Stabilite Ayarları
        state-name: .ftp-deploy-sync-state.json
        log-level: verbose
        
        # KURAL: Sunucudaki _files klasörü ve hassas dosyalar korunur
        exclude: |
          **/_files/**
          _files/**
          **/.git*
          **/.github/**
          **/appsettings.Development.json
          **/logs/**
