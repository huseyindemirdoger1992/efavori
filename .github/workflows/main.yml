name: 🚀 Plesk MVC FTP Deploy (Self-Contained)

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        # .NET 10 SDK'sını GitHub Runner'a kurar
        dotnet-version: '10.0.x' 

    - name: 🔨 Publish Project
      # İSTEDİĞİN AYARLAR: 
      # -c Release (Yapılandırma)
      # --runtime win-x64 (Çalışma zamanı)
      # --self-contained true (Dağıtım modu)
      # -f net10.0 (Hedef çerçeve)
      run: dotnet publish -c Release -r win-x64 --self-contained true -f net10.0 -o ./publish

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        
        # Olası ECONNRESET hatalarına karşı sadece değişenleri gönderir
        state-name: .ftp-deploy-sync-state.json
        log-level: verbose
        
        # KESİN KURAL: Kök dizindeki _files klasörünü korur
        exclude: |
          **/_files/**
          _files/**
          **/.git*
          **/.github/**
          **/appsettings.Development.json
