name: 🚀 Optimized Plesk MVC FTP Deploy

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: 🎉 Deploy to Plesk
    runs-on: windows-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 🔨 Publish Project
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ./publish

    # 1. ADIM: IIS'i durdurmak için app_offline.htm oluştur
    - name: 🛑 Prepare Offline Mode
      shell: pwsh
      run: |
        "<html><head><meta charset='utf-8'></head><body><h1>Sistem Guncelleniyor...</h1></body></html>" | Out-File -FilePath "./publish/app_offline.htm" -Encoding utf8

    # 2. ADIM: Tek seferde tam yükleme (En sağlıklı ve hızlı yöntem)
    # FTP-Deploy-Action zaten sadece değişen dosyaları akıllıca seçer.
    - name: 📤 FTP Upload (All Files)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        port: 21
        timeout: 120000 # 2 dakika
        # Hata payını sıfırlamak için kritik ayarlar:
        dry-run: false
        dangerous-clean-slate: false
        exclude: |
          **/appsettings.Development.json
          **/.git*
          **/.github/**

    # 3. ADIM: Siteden app_offline.htm'i silerek sistemi aç (FTP ile silme)
    # Not: Local publish klasöründen silip tekrar sync ediyoruz, bu en garanti yoldur.
    - name: 🚀 Go Online
      shell: pwsh
      run: Remove-Item "./publish/app_offline.htm" -Force

    - name: 🔄 Remove app_offline from Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        port: 21
