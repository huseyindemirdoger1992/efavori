name: 🚀 Production Deployment (Debug)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: Release
  PUBLISH_OUTPUT: ./publish
  PROJECT_PATH: '_PublisherAssistant/_PublisherAssistant.csproj'
  
jobs:
  build-and-deploy:
  
    name: 🎯 Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔍 Debug - Check Project File
        run: |
          echo "📂 Project structure:"
          ls -la
          echo ""
          echo "📄 Project file exists:"
          test -f ${{ env.PROJECT_PATH }} && echo "✅ Found" || echo "❌ Not found"
          echo ""
          echo "📋 Project content:"
          cat ${{ env.PROJECT_PATH }} || echo "Cannot read file"

      - name: 📦 Restore
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} \
            -p:EnableWindowsTargeting=true \
            --verbosity detailed

      - name: 🔨 Build
        run: |
          dotnet build ${{ env.PROJECT_PATH }} \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            -p:EnableWindowsTargeting=true \
            --verbosity detailed

      - name: 📦 Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --output ${{ env.PUBLISH_OUTPUT }} \
            --no-build \
            -p:EnableWindowsTargeting=true \
            -p:PublishSingleFile=false \
            -p:SelfContained=false

      - name: 🔍 Verify Published Files
        run: |
          echo "📂 Published files:"
          ls -lah ${{ env.PUBLISH_OUTPUT }}
          echo ""
          echo "📊 File count:"
          find ${{ env.PUBLISH_OUTPUT }} -type f | wc -l
          echo ""
          echo "📏 Total size:"
          du -sh ${{ env.PUBLISH_OUTPUT }}

      - name: 🧹 Cleanup
        run: |
          rm -f ${{ env.PUBLISH_OUTPUT }}/*.pdb || true
          rm -f ${{ env.PUBLISH_OUTPUT }}/*.xml || true
          rm -f ${{ env.PUBLISH_OUTPUT }}/appsettings.Development.json || true
          echo "✅ Cleanup done"

      - name: 🔍 Debug - Check FTP Secrets
        run: |
          echo "FTP_SERVER: ${{ secrets.FTP_SERVER != '' && '✅ Set' || '❌ Missing' }}"
          echo "FTP_USERNAME: ${{ secrets.FTP_USERNAME != '' && '✅ Set' || '❌ Missing' }}"
          echo "FTP_PASSWORD: ${{ secrets.FTP_PASSWORD != '' && '✅ Set' || '❌ Missing' }}"

      - name: 🚀 Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ${{ env.PUBLISH_OUTPUT }}/
          server-dir: ./
          log-level: verbose
          timeout: 600000
        continue-on-error: true

      - name: ✅ Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "📅 Time: $(date)"

      - name: ❌ Failed
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs above"
          exit 1
