name: 🚀 Plesk MVC FTP Deploy (32-Bit & Secure)

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4 # v4 sürümüne güncellendi

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x' 

    - name: 🔨 Publish Project (x86)
      # 32-bit (x86) için revize edildi
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ./publish

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        
        # --- GÜVENLİK VE SALDIRI KORUMASI AYARLARI ---
        # Aynı anda çok fazla dosya gönderip sunucuyu tetiklememek için:
        # Sunucunun "Brute Force" veya "DDoS" korumasına takılmayı önler.
        dangerous-clean-slate: false # Sunucudaki her şeyi silip baştan yüklemez
        
        # Değişiklik takibi için durum dosyası
        state-name: .ftp-deploy-sync-state.json
        
        # --- DOSYA KORUMA ---
        exclude: |
          **/_files/**
          _files/**
          **/.git*
          **/.github/**
          **/appsettings.Development.json
          **/web.config
          # Not: web.config dosyasını Plesk üzerinde özelleştirdiysen 
          # yukarıdaki listeye ekleyip ezilmesini engelleyebilirsin.
