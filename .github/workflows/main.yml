name: 🚀 Smart MVC Deploy (Zero Lock Error)

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: 🎉 Deploy to Plesk
    runs-on: windows-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 🔨 Publish Project
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ./publish

    # 1. ADIM: app_offline.htm ile siteyi durdur
    - name: 🛑 Stop App
      shell: pwsh
      run: |
        "<html><body><h1>Guncelleniyor...</h1></body></html>" | Out-File -FilePath "./publish/app_offline.htm" -Encoding utf8

    - name: 📤 Upload app_offline
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        only: |
          app_offline.htm

    # 2. ADIM: IIS'e zaman tanı
    - name: ⏳ Wait for IIS
      run: Start-Sleep -s 20
      shell: pwsh

    # 3. ADIM: AKILLI SENKRONİZASYON + RENAME STRATEJİSİ
    - name: 📤 FTP Sync (Smart)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        port: 21
        # Hata veren dosyalar için otomatik yeniden deneme ve kilit çözme
        retries: 10
        retry-delay: 5000
        dangerous-clean-slate: false
        exclude: |
          **/_files/**
          _files/**
          **/appsettings.Development.json
          **/.git*
          **/.github/**

    # 4. ADIM: app_offline sil ve yayına al
    - name: 🚀 Go Online
      shell: pwsh
      run: Remove-Item "./publish/app_offline.htm" -Force

    - name: 🧹 Final Sync (Remove app_offline)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        protocol: ftp
        exclude: |
          **/_files/**
          _files/**
