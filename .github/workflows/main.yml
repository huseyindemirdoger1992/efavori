name: MVC Project Precision Deploy

on:
  push:
    branches:
      - main  # Burayı projenizin ana branch adına göre (master/main) düzenleyin

jobs:
  build-and-deploy:
    runs-with: ubuntu-latest

    steps:
    - name: 1. Kodu Çek
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Tüm geçmişi çekerek sadece değişen dosyaların daha iyi algılanmasını sağlar

    - name: 2. .NET Kurulumu
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Projenizin versiyonuna göre (6.0, 7.0 vb.) güncelleyin

    - name: 3. Projeyi Yayınla (Publish)
      run: dotnet publish -c Release -o ./publish

    - name: 4. FTP ile Akıllı Senkronizasyon
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /httpdocs/ # Sunucunuzdaki hedef klasör (genelde /httpdocs veya /public_html)
        # Sadece değişenleri gönderir, sunucuda olup yerelde olmayanları SİLMEZ.
        # Eğer sunucudaki eski dosyalar temizlensin isterseniz 'dangerous-clean-slate: true' ekleyebilirsiniz.
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
