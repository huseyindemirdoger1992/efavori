name: 🚀 Pro-Level Plesk Zip & PHP Bridge Deploy
on:
  push:
    branches:
      - master

jobs:
  build-and-publish:
    name: 🔨 Build & Package
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 🔨 Publish Application
      run: |
        dotnet publish -c Release `
          -r win-x86 `
          --self-contained true `
          -p:PublishReadyToRun=true `
          -p:DebugType=None `
          -p:DebugSymbols=false `
          -o ${{ github.workspace }}/publish

    - name: 📦 Create ZIP Archive
      shell: pwsh
      run: |
        # Publish klasörüne git ve içeriği zip'le (klasörün kendisini değil içindekileri)
        Compress-Archive -Path "${{ github.workspace }}/publish/*" -DestinationPath "${{ github.workspace }}/deploy.zip"

    - name: 📝 Create PHP Unzipper & Cleaner Bridge
      shell: pwsh
      run: |
        # Bu script sunucuda çalışarak _files hariç her şeyi siler ve zip'i açar
        $phpScript = @"
        <?php
        `$zipFile = 'deploy.zip';
        `$excludeDir = '_files';

        // 1. TEMİZLİK: _files hariç her şeyi sil
        `$files = glob('*'); 
        foreach (`$files as `$file) {
            if (`$file != `$excludeDir && `$file != 'unzip.php' && `$file != `$zipFile) {
                if (is_dir(`$file)) {
                    system("rmdir /s /q " . escapeshellarg(`$file)); // Windows IIS uyumlu
                } else {
                    unlink(`$file);
                }
            }
        }

        // 2. ZIP ÇIKARMA
        `$zip = new ZipArchive;
        if (`$zip->open(`$zipFile) === TRUE) {
            `$zip->extractTo('.');
            `$zip->close();
            echo "SUCCESS";
            unlink(`$zipFile); // Zip'i sil
        } else {
            echo "ERROR: Zip opening failed";
        }
        ?>
        "@
        $phpScript | Out-File -FilePath "${{ github.workspace }}/unzip.php" -Encoding UTF8

    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deploy-package
        path: |
          ${{ github.workspace }}/deploy.zip
          ${{ github.workspace }}/unzip.php

  deploy:
    name: 📤 Deploy & Execute
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: deploy-package
        path: ./

    - name: 🛰️ FTP Upload (Zip & Bridge)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: httpdocs/
        exclude: |
          **/.git*

    - name: ⚡ Trigger Remote Unzip & Cleanup
      run: |
        # PHP scriptini HTTP üzerinden tetikler
        RESPONSE=$(curl -s https://efavori.com/unzip.php)
        echo "Server Response: $RESPONSE"
        if [[ "$RESPONSE" != *"SUCCESS"* ]]; then
          echo "Deployment failed during unzipping"
          exit 1
        fi

    - name: 🧹 Delete Bridge File
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: httpdocs/
        method: delete
        local-dir: ./
        exclude: |
          **/*
          !unzip.php

    - name: 🌡️ Health Check
      run: |
        curl -f https://efavori.com || exit 1
