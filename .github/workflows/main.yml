name: 🚀 Plesk MVC FTP Deploy (Delta Sync)

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # ÖNEMLİ: Değişen dosyaları anlaması için tüm geçmişi çeker

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x' 

    - name: 🔨 Publish Project (x86)
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ./publish

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: httpdocs/
        
        # --- SADECE DEĞİŞENLERİ GÖNDERME AYARI ---
        # Bu dosya sunucuda saklanır ve hangi dosyanın değiştiğini takip eder.
        state-name: .ftp-deploy-sync-state.json
        
        # --- SUNUCU DOSTU AYARLAR ---
        # Eşzamanlı bağlantı sayısını 1 yaparak "saldırı" algısını önleriz.
        # Paylaşımlı hostinglerde (Plesk) çoklu bağlantı genelde ban sebebidir.
        protocol: ftp
        port: 21
        timeout: 60000 # 60 saniye zaman aşımı
