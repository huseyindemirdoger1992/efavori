name: 🚀 Plesk MVC FTP Deploy (Zero Error)
on:
  push:
    branches:
      - master
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 
        
    - name: 🔨 Publish Project
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ${{ github.workspace }}/publish
      
    # ========================================
    # 1. ADIM: IIS'İ DURDUR VE BEKLE
    # ========================================
    
    - name: 🛑 Create app_offline.htm
      shell: pwsh
      run: |
        $path = "${{ github.workspace }}/publish/app_offline.htm"
        @"
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset='utf-8'>
            <meta http-equiv='refresh' content='10'>
            <title>Güncelleme</title>
        </head>
        <body style='font-family:Arial;text-align:center;padding:50px;'>
            <h1>🔄 Sistem Güncelleniyor</h1>
            <p>Lütfen birkaç saniye bekleyin...</p>
        </body>
        </html>
        "@ | Out-File -FilePath $path -Encoding UTF8
        
        if (Test-Path $path) { 
            Write-Host "✅ app_offline.htm oluşturuldu ($(( Get-Item $path).Length) bytes)"
        }
        
    - name: 📤 Upload app_offline.htm ONLY
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        protocol: ftp
        port: 21
        timeout: 30000
        dangerous-clean-slate: false
        dry-run: false
        exclude: |
          **/*
          !app_offline.htm
          
    - name: ⏳ Wait for IIS to Release Files (CRITICAL)
      shell: pwsh
      run: |
        Write-Host "⏸️  IIS'in dosyaları serbest bırakması bekleniyor..."
        Write-Host "Timestamp: $(Get-Date -Format 'HH:mm:ss')"
        Start-Sleep -s 30  # 30 saniye bekle (Plesk için kritik!)
        Write-Host "✅ IIS lock süresi doldu: $(Get-Date -Format 'HH:mm:ss')"

    # ========================================
    # 2. ADIM: DOSYALARI YÜKLE (IIS KAPALI)
    # ========================================
    
    - name: 🔧 Install LFTP
      shell: pwsh
      run: |
        Write-Host "Installing LFTP..."
        choco install lftp -y --no-progress
        lftp --version
        
    - name: 📂 Deploy Files with LFTP
      shell: pwsh
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USER: ${{ secrets.FTP_ACCOUNT }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        # LFTP config
        $script = @"
        set ftp:ssl-allow no
        set ftp:passive-mode on
        set net:timeout 90
        set net:max-retries 15
        set net:reconnect-interval-base 5
        set net:reconnect-interval-multiplier 1
        set net:connection-limit 1
        set ftp:sync-mode off
        set file:charset UTF-8
        
        open ftp://${env:FTP_USER}:${env:FTP_PASS}@${env:FTP_SERVER}
        
        lcd ${{ github.workspace }}/publish
        cd httpdocs
        
        # Mirror with excludes
        mirror -R \
          --verbose \
          --no-perms \
          --no-umask \
          --parallel=1 \
          --exclude-glob .git* \
          --exclude-glob .github/ \
          --exclude-glob _files/ \
          --exclude-glob **/_files/ \
          --exclude-glob appsettings.Development.json \
          --exclude app_offline.htm \
          ./ ./
        
        bye
        "@
        
        $script | Out-File -FilePath lftp-deploy.txt -Encoding ASCII
        
        Write-Host "📤 Starting deployment..."
        lftp -f lftp-deploy.txt
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Deployment failed!"
          exit 1
        }
        
        Write-Host "✅ All files uploaded successfully!"

    # ========================================
    # 3. ADIM: IIS'İ YENİDEN BAŞLAT
    # ========================================
    
    - name: 🧹 Delete Local app_offline.htm
      shell: pwsh
      run: |
        $file = "${{ github.workspace }}/publish/app_offline.htm"
        if (Test-Path $file) {
          Remove-Item $file -Force
          Write-Host "✅ Local app_offline.htm deleted"
        }
        
    - name: 🔥 Delete Remote app_offline.htm (via FTP command)
      shell: pwsh
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USER: ${{ secrets.FTP_ACCOUNT }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        # LFTP ile app_offline.htm'i sil
        $deleteScript = @"
        set ftp:ssl-allow no
        set ftp:passive-mode on
        open ftp://${env:FTP_USER}:${env:FTP_PASS}@${env:FTP_SERVER}
        cd httpdocs
        rm -f app_offline.htm
        bye
        "@
        
        $deleteScript | Out-File -FilePath lftp-delete.txt -Encoding ASCII
        lftp -f lftp-delete.txt
        
        Write-Host "✅ Remote app_offline.htm silindi - IIS yeniden başlıyor!"
        
    - name: ⏳ Wait for IIS Restart
      shell: pwsh
      run: |
        Write-Host "⏸️  IIS'in başlaması bekleniyor..."
        Start-Sleep -s 15
        Write-Host "✅ IIS hazır!"

    # ========================================
    # 4. ADIM: DOĞRULAMA
    # ========================================
    
    - name: 🌡️ Warm Up & Verify Site
      shell: pwsh
      run: |
        Write-Host "🔥 Site uyandırılıyor ve test ediliyor..."
        
        $maxAttempts = 5
        $attempt = 0
        $success = $false
        
        while ($attempt -lt $maxAttempts -and -not $success) {
          $attempt++
          Write-Host "`n🔍 Deneme $attempt/$maxAttempts..."
          
          try {
            Start-Sleep -s 3
            $response = Invoke-WebRequest -Uri "https://efavori.com" -UseBasicParsing -TimeoutSec 30
            
            if ($response.StatusCode -eq 200) {
              Write-Host "✅ Site BAŞARILI! Status: $($response.StatusCode)"
              Write-Host "📄 Content Length: $($response.Content.Length) bytes"
              $success = $true
            }
          } catch {
            Write-Warning "⚠️  Deneme $attempt başarısız: $($_.Exception.Message)"
            if ($attempt -eq $maxAttempts) {
              Write-Error "❌ Site $maxAttempts denemede yanıt vermedi!"
              exit 1
            }
          }
        }
        
        Write-Host "`n🎉 DEPLOYMENT TAMAMLANDI!"
