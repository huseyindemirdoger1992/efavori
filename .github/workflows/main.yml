name: 🚀 Plesk MVC FTP Deploy (Advanced)

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' 

    - name: 🔨 Publish Project
      # --no-self-contained: Sunucudaki mevcut runtime'ı kullanarak dosya boyutunu küçültür
      run: dotnet publish -c Release -o ./publish --no-self-contained

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        # Plesk kök dizinine göre hedef klasör
        server-dir: httpdocs/
        
        # --- KRİTİK GÜVENLİK VE PERFORMANS AYARLARI ---
        
        # 1. Sadece değişen dosyaları gönderir (ECONNRESET hatasını önlemek için en iyi yöntem)
        state-name: .ftp-deploy-sync-state.json
        
        # 2. Bağlantı sorunlarına karşı agresif olmayan transfer
        log-level: verbose
        
        # 3. Klasör Koruma Kuralları
        exclude: |
          **/_files/**
          _files/**
          **/.git*
          **/.github/**
          **/appsettings.Development.json
          **/web.config.original
          **/logs/**
