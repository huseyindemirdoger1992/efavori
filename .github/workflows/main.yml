name: 🚀 Plesk MVC FTP Deploy (Zero Error)
on:
  push:
    branches:
      - master
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 
        
    - name: 🔨 Publish Project
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ${{ github.workspace }}/publish
      
    # --- 1. ADIM: DURDURMA ---
    - name: 🛑 Stop App
      shell: pwsh
      run: |
        $path = "${{ github.workspace }}/publish/app_offline.htm"
        "<html><head><meta charset='utf-8'></head><body><h1>Sistem Guncelleniyor...</h1></body></html>" | Out-File -FilePath $path -Encoding utf8
        if (Test-Path $path) { Write-Host "✅ app_offline.htm oluşturuldu." }
        
    - name: 📤 Upload app_offline
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        dangerous-clean-slate: false
        protocol: ftp               # ← Düz FTP dene (FTPS sorunlu olabilir)
        port: 21
        timeout: 30000              # ← 30 saniyeye düşür
        log-level: verbose          # ← Detaylı log için
        only: |
          app_offline.htm
          
    - name: ⏳ Wait for IIS
      run: Start-Sleep -s 10
      shell: pwsh

    # --- 2. ADIM: ULTRA-SAFE SENKRONİZASYON ---
    
    # Aşama 1: Sadece değişen küçük dosyaları gönder
    - name: 📦 Stage 1 - Config & Small Files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        state-name: .ftp-deploy-stage1.json
        protocol: ftp               # ← Düz FTP
        port: 21
        parallel: 1                 # ← TEK DOSYA (en güvenli)
        timeout: 60000              # ← 1 dakika per dosya
        retries: 25                 # ← Maksimum retry
        retry-delay: 2000           # ← 2 saniye ara
        exclude: |
          **/appsettings.Development.json
          **/.git*
          **/.github/**
          _files/**
          **/_files/**
          **/*.dll
          **/*.exe
          **/*.pdb
          **/*.so
          **/*.dylib
          
    - name: ⏸️ Cooldown 1 (Connection Reset)
      run: Start-Sleep -s 8
      shell: pwsh
      
    # Aşama 2: DLL dosyaları (en kritik kısım)
    - name: 🔧 Stage 2 - DLL Files (Sequential)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        state-name: .ftp-deploy-stage2.json
        protocol: ftp
        port: 21
        parallel: 1                 # ← TEK TEK gönder
        timeout: 90000              # ← 90 saniye per dosya
        retries: 30                 # ← 30 deneme
        retry-delay: 3000           # ← 3 saniye ara
        only: |
          **/*.dll
          
    - name: ⏸️ Cooldown 2 (Connection Reset)
      run: Start-Sleep -s 8
      shell: pwsh
      
    # Aşama 3: EXE ve PDB dosyaları
    - name: 🏗️ Stage 3 - EXE & PDB Files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        state-name: .ftp-deploy-stage3.json
        protocol: ftp
        port: 21
        parallel: 1
        timeout: 90000
        retries: 30
        retry-delay: 3000
        only: |
          **/*.exe
          **/*.pdb
          
    - name: ⏸️ Cooldown 3 (Connection Reset)
      run: Start-Sleep -s 8
      shell: pwsh
      
    # Aşama 4: Final verification sync
    - name: 🔄 Stage 4 - Final Verification Sync
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        state-name: .ftp-deploy-final.json
        protocol: ftp
        port: 21
        parallel: 1
        timeout: 120000             # ← 2 dakika final sync için
        retries: 25
        retry-delay: 3000
        exclude: |
          **/appsettings.Development.json
          **/.git*
          **/.github/**
          _files/**
          **/_files/**

    # --- 3. ADIM: BAŞLATMA VE DOĞRULAMA ---
    - name: 🚀 Start App (Safe Remove)
      shell: pwsh
      run: |
        Remove-Item "${{ github.workspace }}/publish/app_offline.htm" -Force -ErrorAction SilentlyContinue
        Write-Host "✅ Yerel app_offline silindi."
        
    - name: 🧹 Clean Remote & Online
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        protocol: ftp
        port: 21
        timeout: 60000
        retries: 10
        
    - name: 🌡️ Warm Up Site
      shell: pwsh
      run: |
        Write-Host "Site uyandırılıyor..."
        Start-Sleep -s 5
        try {
            $response = Invoke-WebRequest -Uri "https://efavori.com" -UseBasicParsing -TimeoutSec 30
            Write-Host "✅ Site yanıt verdi: $($response.StatusCode)"
        } catch {
            Write-Warning "⚠️ Site henüz hazır değil veya hata döndürdü: $_"
        }
