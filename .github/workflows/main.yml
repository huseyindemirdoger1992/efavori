name: 🚀 Pro-Level Plesk MVC FTP Deploy
on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: windows-latest
    timeout-minutes: 20 

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 🔨 Publish Project
      run: dotnet publish -c Release -r win-x86 --self-contained true -f net10.0 -o ${{ github.workspace }}/publish

    # ========================================
    # 1. ADIM: IIS KİLİDİNİ KIR (STABİL BAĞLANTI İLE)
    # ========================================
    
    - name: 🛑 Prepare app_offline.htm
      shell: pwsh
      run: |
        $path = "${{ github.workspace }}/publish/app_offline.htm"
        "<!DOCTYPE html><html><body style='font-family:sans-serif;text-align:center;padding-top:50px;'><h1>🔄 Sistem Guncelleniyor</h1><p>Lutfen bekleyin...</p></body></html>" | Out-File -FilePath $path -Encoding UTF8
    
    - name: 📤 Upload app_offline.htm
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        # --- BAĞLANTI HATASINI ÇÖZEN AYARLAR ---
        protocol: ftp
        port: 21
        # ECONNRESET hatası için kritik ayar:
        security: loose 
        # ---------------------------------------
        exclude: |
          **/*
          !app_offline.htm

    - name: ⏳ Wait for IIS Lock Release
      shell: pwsh
      run: Start-Sleep -s 30

    # ========================================
    # 2. ADIM: DELTA DEPLOYMENT (HATA TOLERANSLI)
    # ========================================
    
    - name: 📂 Deploy Changed Files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        state-name: .ftp-deploy-sync-state.json
        # --- BAĞLANTI STABİLİZASYONU ---
        protocol: ftp
        port: 21
        timeout: 900000 # 15 Dakika
        retries: 20
        retry-delay: 10000 # Bağlantı koptuğunda 10sn bekle ve tekrar dene
        # -------------------------------
        exclude: |
          **/appsettings.Development.json
          **/.git*
          **/.github/**
          _files/**
          **/_files/**
          app_offline.htm

    # ========================================
    # 3. ADIM: RESTART & HEALTH CHECK
    # ========================================

    - name: 🚀 Start IIS (Remove app_offline)
      if: always() 
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ github.workspace }}/publish/
        server-dir: httpdocs/
        # app_offline'ı silmek için state-name kullanıyoruz
        state-name: .ftp-deploy-sync-state.json
        exclude: |
          **/*
          app_offline.htm 

    - name: 🌡️ Health Check
      shell: pwsh
      run: |
        $url = "https://efavori.com"
        for($i=1; $i -le 10; $i++) {
          try {
            $res = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 20
            if ($res.StatusCode -eq 200) { exit 0 }
          } catch { Start-Sleep -s 10 }
        }
        exit 1
