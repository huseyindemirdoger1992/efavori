name: 🚀 Plesk MVC FTP Deploy

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    # HATA ÇÖZÜMÜ: Ubuntu yerine windows-latest kullanıyoruz
    runs-on: windows-latest 
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: ⚙️ Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' 

    - name: 🔨 Publish Project
      # Windows üzerinde derleme yapıyoruz
      run: dotnet publish -c Release -o ./publish

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_ACCOUNT }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        # Plesk klasör yapısına göre gerekirse aktif et: 
        # server-dir: ./httpdocs/
        
        # KURAL: _files klasörü ve içeriği asla silinmeyecek
        exclude: |
          **/_files/**
          _files/**
          **/.git*
          **/.github/**
          **/appsettings.Development.json
