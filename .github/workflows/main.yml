name: Deploy to FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build project
      run: dotnet build --configuration Release --no-restore
    
    - name: Publish project
      run: |
        dotnet publish --configuration Release `
          --framework net10.0 `
          --runtime win-x86 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          --output ./publish
    
    - name: Create deployment package
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath deployment.zip
    
    - name: Deploy to FTP (with retry and exclusions)
      shell: pwsh
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_ACCOUNT: ${{ secrets.FTP_ACCOUNT }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        $maxRetries = 3
        $retryDelay = 5
        
        function Upload-FileWithRetry {
            param($LocalPath, $RemotePath)
            
            for ($i = 1; $i -le $maxRetries; $i++) {
                try {
                    $ftpRequest = [System.Net.FtpWebRequest]::Create("ftp://$env:FTP_SERVER/$RemotePath")
                    $ftpRequest.Credentials = New-Object System.Net.NetworkCredential($env:FTP_ACCOUNT, $env:FTP_PASSWORD)
                    $ftpRequest.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
                    $ftpRequest.UseBinary = $true
                    $ftpRequest.KeepAlive = $false
                    $ftpRequest.Timeout = 300000
                    $ftpRequest.ReadWriteTimeout = 300000
                    
                    $fileContent = [System.IO.File]::ReadAllBytes($LocalPath)
                    $ftpRequest.ContentLength = $fileContent.Length
                    
                    $requestStream = $ftpRequest.GetRequestStream()
                    $requestStream.Write($fileContent, 0, $fileContent.Length)
                    $requestStream.Close()
                    
                    $response = $ftpRequest.GetResponse()
                    Write-Host "Uploaded: $RemotePath - Status: $($response.StatusDescription)"
                    $response.Close()
                    return $true
                }
                catch {
                    Write-Host "Attempt $i failed for $RemotePath : $_"
                    if ($i -lt $maxRetries) {
                        Start-Sleep -Seconds $retryDelay
                    }
                }
            }
            Write-Host "Failed to upload $RemotePath after $maxRetries attempts"
            return $false
        }
        
        function Create-FtpDirectory {
            param($RemotePath)
            
            try {
                $ftpRequest = [System.Net.FtpWebRequest]::Create("ftp://$env:FTP_SERVER/$RemotePath")
                $ftpRequest.Credentials = New-Object System.Net.NetworkCredential($env:FTP_ACCOUNT, $env:FTP_PASSWORD)
                $ftpRequest.Method = [System.Net.WebRequestMethods+Ftp]::MakeDirectory
                $response = $ftpRequest.GetResponse()
                $response.Close()
                Write-Host "Created directory: $RemotePath"
            }
            catch {
                # Directory might already exist, continue
            }
        }
        
        # Upload files from publish folder
        $publishFolder = "./publish"
        $remoteBase = "httpdocs"
        
        Get-ChildItem -Path $publishFolder -Recurse -File | ForEach-Object {
            $relativePath = $_.FullName.Substring($publishFolder.Length + 1)
            $remotePath = "$remoteBase/$($relativePath -replace '\\', '/')"
            
            # Skip _files directory
            if ($remotePath -notlike "*/_files/*" -and $relativePath -notlike "_files\*") {
                $remoteDir = Split-Path $remotePath -Parent
                if ($remoteDir) {
                    Create-FtpDirectory -RemotePath $remoteDir
                }
                
                Write-Host "Uploading: $relativePath"
                Upload-FileWithRetry -LocalPath $_.FullName -RemotePath $remotePath
                
                # Small delay between uploads to prevent timeout
                Start-Sleep -Milliseconds 500
            }
            else {
                Write-Host "Skipping: $relativePath (excluded)"
            }
        }
        
        Write-Host "Deployment completed!"
